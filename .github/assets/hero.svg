<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Elyrion — Only the worthy enter Elysium">
  <defs>
    <radialGradient id="glow" cx="72%" cy="48%" r="70%">
      <stop offset="0" stop-color="#1c170f"/>
      <stop offset="0.6" stop-color="#0B0A08"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E2C58B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E2C58B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1CF"/>
      <stop offset="1" stop-color="#C9A063"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2C58B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF1CF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E2C58B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E7CE96" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <mask id="fade"><rect width="1280" height="420" fill="url(#halo2)"/></mask>
    <radialGradient id="halo2" cx="70%" cy="50%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <clipPath id="round"><rect width="1280" height="420" rx="22"/></clipPath>
  </defs>
  <style>
    .lk{stroke:#E2C58B;stroke-opacity:.12;stroke-width:.8}
    .st{fill:#E8D09C;animation:tw 4.8s ease-in-out infinite}
    .s1{animation-delay:-.8s}.s2{animation-delay:-1.6s}.s3{animation-delay:-2.4s}.s4{animation-delay:-3.2s}.s5{animation-delay:-4s}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    .pl{stroke:#FFE2AA;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:18 100;stroke-dashoffset:118;opacity:0;animation:pulse 7.2s cubic-bezier(.32,.72,0,1) infinite}
    .p1{animation-delay:1.2s}.p2{animation-delay:2.4s}.p3{animation-delay:3.6s}.p4{animation-delay:4.8s}.p5{animation-delay:6s}
    @keyframes pulse{0%{stroke-dashoffset:118;opacity:0}6%{opacity:1}24%{stroke-dashoffset:0;opacity:1}32%,100%{stroke-dashoffset:0;opacity:0}}
    .gate{fill:none;stroke:#E2C58B;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:0;animation:draw 2.6s cubic-bezier(.32,.72,0,1) both}
    .g2{animation-delay:.3s}.g3{animation-delay:.6s}
    @keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
    .core{fill:#FFE6B0;opacity:.85;animation:core 3.6s cubic-bezier(.32,.72,0,1) 1.6s infinite}
    @keyframes core{0%{opacity:0;r:1}20%{opacity:1;r:5}60%{opacity:.85;r:4.2}100%{opacity:.85;r:4.2}}
    .rise{opacity:1;animation:rise 1.6s cubic-bezier(.32,.72,0,1) both}
    .r1{animation-delay:.5s}.r2{animation-delay:.8s}.r3{animation-delay:1.1s}.r4{animation-delay:1.4s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .sheen{animation:sweep 6s cubic-bezier(.32,.72,0,1) 2s infinite}
    @keyframes sweep{0%{transform:translateX(-420px)}40%,100%{transform:translateX(620px)}}
    .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
    .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.gate{stroke-dashoffset:0}.rise,.core,.st{opacity:1}}
  </style>
